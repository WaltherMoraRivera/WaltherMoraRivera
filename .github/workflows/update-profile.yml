name: Actualizar tarjetas del perfil

# Solo se ejecuta con el secreto PROFILE_TOKEN (token personal de solo lectura).
# Sin él, GitHub entrega únicamente la actividad pública y las cifras bajarían mucho,
# así que el trabajo se omite y las tarjetas se regeneran a mano: python scripts/generate.py
on:
  schedule:
    - cron: "0 6 * * 1"   # cada lunes, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarjetas:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PROFILE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
      - name: Generar tarjetas
        if: env.HAS_TOKEN == 'true'
        run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Guardar cambios
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: actualizar tarjetas del perfil" && git push)
