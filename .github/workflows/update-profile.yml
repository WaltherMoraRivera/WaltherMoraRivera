name: Refresh profile cards

# Runs only when the repository has a PROFILE_TOKEN secret (a read-only personal token).
# Without it GitHub returns public activity only and the numbers would drop, so the job
# skips itself; refresh by hand instead: python3 scripts/generate.py
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PROFILE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-python@v5
        if: env.HAS_TOKEN == 'true'
        with:
          python-version: "3.12"
      - name: Generate cards
        if: env.HAS_TOKEN == 'true'
        run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit changes
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore: refresh profile cards" && git push)
